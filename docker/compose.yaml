# Base de datos local para desarrollo.
# Uso desde la raíz: pnpm db:up / pnpm db:down
name: gestor-semilleros

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semilleros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semilleros}
      POSTGRES_DB: ${POSTGRES_DB:-semilleros}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql/<versión>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
