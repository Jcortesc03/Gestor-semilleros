# Despliegue con contenedores (ADR 0012): PostgreSQL + backend NestJS + web (nginx).
#
# Uso desde la raíz del repositorio:
#   cp docker/env.prod.example docker/.env.prod   # y completa los secretos
#   docker compose -f docker/compose.prod.yaml --env-file docker/.env.prod up -d --build
#
# Solo la web publica un puerto: nginx sirve la aplicación y redirige /api al
# backend, así que web y API comparten origen (necesario para las cookies de Auth.js).
name: gestor-semilleros-prod

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en docker/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en docker/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-semilleros}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    image: gestor-semilleros/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-semilleros}?schema=public
      # Detrás de nginx: Auth.js construye las URL con el Host público que reenvía el proxy.
      AUTH_TRUST_HOST: "true"
    volumes:
      # Credenciales de la sesión de WhatsApp (Baileys). Trátalas como un secreto.
      # La carpeta es <WHATSAPP_SESSION_NAME>_sessions; si cambias el nombre, cambia esta ruta.
      - whatsapp-sessions:/app/whatsapp_sessions
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
        required: false   # solo existe con el perfil s3-local

  # S3 compatible local (RustFS) para probar el despliegue sin AWS. Opcional:
  #   docker compose ... --profile s3-local up -d --build
  # En producción con AWS S3 no actives el perfil y deja S3_ENDPOINT vacío.
  s3:
    image: rustfs/rustfs:1.0.4
    profiles: ["s3-local"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Define S3_ACCESS_KEY_ID en docker/.env.prod}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Define S3_SECRET_ACCESS_KEY en docker/.env.prod}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      # Consola web solo en la máquina local: http://127.0.0.1:${S3_CONSOLE_PORT:-9001}
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: gestor-semilleros/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  whatsapp-sessions:
  s3-data:
